{% extends "auth.html" %}
{% block title %}Sign in · Blueboard{% endblock %}

{% block content %}
  <span class="eyebrow">Ateneo Campus Events</span>
  <h1>Welcome back.</h1>

  {% if error %}<div class="error"><svg class="i"><use href="#i-info"/></svg>{{ error }}</div>{% endif %}

  <form method="post" novalidate>
    {% csrf_token %}

    <div class="auth-fields">
      <label class="field">
        <span>Email</span>
        <input class="control" type="email" name="email" placeholder="you@ateneo.edu" autocomplete="email"
               value="{{ form.email|default:'' }}" required>
      </label>

      <label class="field">
        <span>Password</span>
        <input class="control" type="password" name="password" placeholder="Enter your password"
               autocomplete="current-password" required>
      </label>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
  </form>

  <p class="switch">New to Blueboard? <a href="{% url 'register' %}">Create an account</a></p>
{% endblock %}
