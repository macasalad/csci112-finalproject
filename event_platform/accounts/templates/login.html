{% extends "auth_base.html" %}
{% block title %}Sign in · Blueboard{% endblock %}

{% block content %}
  <div class="eyebrow">Ateneo Campus Events</div>
  <h1>Welcome back.</h1>

  <div class="tabs">
    <button type="button" class="tab active" data-role="student">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.7a6 6 0 0 1 10 0"/></svg>
      Student
    </button>
    <button type="button" class="tab" data-role="organization">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>
      Organization
    </button>
  </div>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post" novalidate>
    {% csrf_token %}
    <input type="hidden" name="role" id="role" value="{{ role|default:'student' }}">

    <div class="field">
      <label for="email" id="email-label">Student email</label>
      <input type="email" id="email" name="email" placeholder="name@student.ateneo.edu"
             value="{{ form.email|default:'' }}" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>
    </div>

    <button type="submit" class="btn">Sign in</button>
  </form>

  <p class="switch">New to Blueboard? <a href="/register/">Create an account</a></p>
{% endblock %}
