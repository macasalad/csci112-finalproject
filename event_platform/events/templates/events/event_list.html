<!DOCTYPE html>
<html>
<head>
    <title>Events</title>
</head>
<body>

    <h1>Available Events</h1>

    {% for event in events %}

        <div>
            <h2>{{ event.eventName }}</h2>
            <p>{{ event.description }}</p>
            <p>{{ event.location }}</p>
            <p>{{ event.status }}</p>
        </div>

        <hr>

    {% empty %}

        <p>No events found.</p>

    {% endfor %}

</body>
</html>
